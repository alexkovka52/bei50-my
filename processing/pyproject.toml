[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siret3"
version = "0.1.0"
description = "Sireț3 vineyard spatial pipeline: tiles, CVAT 1.1, measurements (EPSG:32635), closed route."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gigahack-bei50" }]
dependencies = [
  "rasterio==1.5.1",
  "geopandas==1.1.4",
  "shapely==2.1.2",
  "pyproj==3.8.0",
  "networkx==3.7",
  "numpy==2.5.3",
  "lxml==6.1.3",
]

[project.optional-dependencies]
route-ortools = ["ortools>=9.10"]
dev = ["pytest==9.1.1"]

[project.scripts]
siret3 = "siret3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
