# Include inside the dementra.md TLS server block (not inside http or another server).
# Installs with web/scripts/install_nginx_tiles.sh. The app stays proxied to :43180;
# this file only adds /tiles/.
#
# Do not set gzip_types here. In a server block it replaces the http-level list
# instead of extending it, and CSS/JS compression for dementra.md would drop.
# Add application/json and application/geo+json to the http block's gzip_types.
# gzip and gzip_proxied do not replace that list. alias already 404s a missing
# file; try_files would ignore the alias and look under /opt/dementra-tiles/tiles/.

gzip on;
gzip_proxied any;

location /tiles/ {
    alias /opt/dementra-tiles/;
    types {
        image/webp webp;
        application/json json;
    }
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}
