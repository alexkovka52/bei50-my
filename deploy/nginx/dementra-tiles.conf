# Include inside the dementra.md TLS server block (not inside http or another server).
# Installs with web/scripts/install_nginx_tiles.sh. The app stays proxied to :43180;
# this file only adds /tiles/.
#
# gzip_types in a server block replaces the http-level list. On inventica-crm the http
# block leaves gzip_types at its default (text/html only), so listing the text types
# here only adds compression (the 10 MB of survey GeoJSON). If the http block ever gets
# a broader list, move these types there instead.
# alias already 404s a missing file; try_files would ignore the alias and look under
# /opt/dementra-tiles/tiles/.

gzip on;
gzip_proxied any;
gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain;

location /tiles/ {
    alias /opt/dementra-tiles/;
    types {
        image/webp webp;
        application/json json;
    }
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}
