# Include inside the dementra.md TLS server block (not inside http or another server).
# Installs with web/scripts/install_nginx_tiles.sh. The app stays proxied to :43180;
# this file only adds /tiles/ and gzip for JSON the app already serves.

# JSON and GeoJSON from the Next.js app (proxy_pass). text/html stays gzip's default.
gzip on;
gzip_proxied any;
gzip_types application/json application/geo+json;

location /tiles/ {
    alias /opt/dementra-tiles/;
    try_files $uri =404;
    types {
        image/webp webp;
        application/json json;
    }
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}
